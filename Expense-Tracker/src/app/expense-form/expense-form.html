<div class="form-container">
    <h2>{{ editingId ? 'Update Expense' : 'Add Expense' }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" formControlName="amount" placeholder="0.00" />
            <div class="text-danger" *ngIf="form.controls['amount'].invalid && form.controls['amount'].touched">
                Amount is required.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" formControlName="category">
                <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" formControlName="date" />
            <div class="text-danger" *ngIf="form.controls['date'].hasError('required') && form.controls['date'].touched">
                Date is required.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Note (optional)</label>
            <textarea class="form-control" formControlName="note" placeholder="e.g. Groceries"></textarea>
        </div>

        <button type="submit" class="btn btn-primary me-2" [disabled]="form.invalid">
            {{ editingId ? 'Update Expense' : 'Add Expense' }}
        </button>
        <a class="btn btn-outline-secondary" (click)="onCancel()">Cancel</a>
    </form>
</div>
