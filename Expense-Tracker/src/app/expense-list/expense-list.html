<div class="container mt-4">
    <h2 class="mb-3">Your Expenses</h2>

    <div class="row g-3 align-items-end mb-4 p-3 bg-light rounded border">
        <div class="col-auto">
            <label class="form-label">Category</label>
            <select class="form-select" (change)="onCategoryChange($any($event.target).value)">
                <option value="All">All</option>
                <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
        </div>

        <div class="col-auto">
            <label class="form-label">Search note</label>
            <input type="text" class="form-control" placeholder="Search..." (input)="onSearchChange($any($event.target).value)" />
        </div>

        <div class="col-auto">
            <label class="form-label">Sort by</label>
            <select class="form-select" (change)="onSortByChange($any($event.target).value)">
                <option value="date">Date</option>
                <option value="amount">Amount</option>
            </select>
        </div>

        <div class="col-auto">
            <button class="btn btn-outline-secondary" (click)="toggleSortDir()">
                {{ sortDir === 'asc' ? 'Ascending' : 'Descending' }}
            </button>
        </div>
    </div>

    <div class="alert alert-primary">
        Total ({{ getFilteredExpenses().length }} shown): <strong>{{ getTotal() | currency }}</strong>
    </div>

    <p *ngIf="getFilteredExpenses().length === 0">No expenses match your filters.</p>

    <table class="table table-bordered table-striped table-hover align-middle" *ngIf="getFilteredExpenses().length > 0">
        <thead class="table-light">
            <tr>
                <th>Category</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Note</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let expense of getFilteredExpenses()" [appHighlightOverBudget]="expense.amount" [threshold]="100">
                <td>{{ expense.category | categoryIcon }}</td>
                <td>{{ expense.amount | currency }}</td>
                <td>{{ expense.date }}</td>
                <td>{{ expense.note || '-' }}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" (click)="onEdit(expense.id)">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" (click)="onDelete(expense.id)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
